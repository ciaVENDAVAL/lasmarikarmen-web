show_deck:
  es: El funeral folclórico de Lady Marikarmen se convierte en <b>una fiesta multimedia</b> de hip-hop electrónico, vientos y travestismo.
  en: "Lady Marikarmen's folkloric funeral becomes <b>a multimedia party</b> of electronic hip-hop, horns and drag."
  ca: "El funeral folklòric de Lady Marikarmen es converteix en <b>una festa multimèdia</b> d'hip-hop electrònic, vents i travestisme."
  gl: "O funeral folclórico de Lady Marikarmen convértese en <b>unha festa multimedia</b> de hip-hop electrónico, ventos e travestismo."
  eu: "Lady Marikarmenen hileta folklorikoa <b>festa multimedia</b> bihurtzen da, hip-hop elektroniko, haize-musika eta trabestismoz betea."
  pt: "O funeral folclórico de Lady Marikarmen transforma-se em <b>uma festa multimédia</b> de hip-hop eletrónico, sopros e travestismo."
  fr: "Les funérailles folkloriques de Lady Marikarmen deviennent <b>une fête multimédia</b> de hip-hop électronique, de cuivres et de travestissement."
  it: "Il funerale folkloristico di Lady Marikarmen diventa <b>una festa multimediale</b> di hip-hop elettronico, fiati e travestitismo."
  de: "Die folkloristische Beerdigung von Lady Marikarmen wird zu <b>einer Multimedia-Party</b> aus elektronischem Hip-Hop, Bläsern und Travestie."
  ja: "レディ・マリカルメンの民俗的なお葬式が、エレクトロ・ヒップホップと管楽器とドラァグの<b>マルチメディア・パーティー</b>に変わります。"
show_p1:
  es: "Proyecciones de vídeo, luces y una columna de niebla con LEDs programada al ritmo del beat. Tocamos encima del escenario y bajamos al público. Un directo explosivo y lleno de sorpresas al que todo el mundo está invitade: un viaje de redescubrimiento y locura por el universo queer de Las Marikarmen."
  en: "Video projections, lights and a column of fog with LEDs programmed to the beat. We play on stage and come down into the audience. An explosive live show full of surprises that everyone is invited to: a journey of rediscovery and madness through the queer universe of Las Marikarmen."
  ca: "Projeccions de vídeo, llums i una columna de boira amb LEDs programada al ritme del beat. Toquem dalt de l'escenari i baixem entre el públic. Un directe explosiu i ple de sorpreses al qual tothom està convidadi: un viatge de redescobriment i bogeria per l'univers queer de Las Marikarmen."
  gl: "Proxeccións de vídeo, luces e unha columna de néboa con LEDs programada ao ritmo do beat. Tocamos enriba do escenario e baixamos ao público. Un directo explosivo e cheo de sorpresas ao que todo o mundo está convidade: unha viaxe de redescubrimento e tolemia polo universo queer de Las Marikarmen."
  eu: "Bideo-proiekzioak, argiak eta beat-aren erritmora programatutako LEDdun laino-zutabe bat. Eszenatokian jotzen dugu eta publikoarengana jaisten gara. Zuzeneko lehergarria eta ezustekoz betea, denok gonbidatuta zaudetena: Las Marikarmenen unibertso queerrean zehar berraurkikuntza- eta eromen-bidaia bat."
  pt: "Projeções de vídeo, luzes e uma coluna de nevoeiro com LEDs programada ao ritmo do beat. Tocamos em cima do palco e descemos até ao público. Um concerto explosivo e cheio de surpresas para o qual toda a gente está convidade: uma viagem de redescoberta e loucura pelo universo queer de Las Marikarmen."
  fr: "Projections vidéo, lumières et une colonne de brouillard à LED programmée sur le beat. Nous jouons sur scène et descendons dans le public. Un live explosif et plein de surprises où tout le monde est invité·e : un voyage de redécouverte et de folie dans l'univers queer de Las Marikarmen."
  it: "Proiezioni video, luci e una colonna di nebbia con LED programmata a tempo di beat. Suoniamo sul palco e scendiamo tra il pubblico. Un live esplosivo e pieno di sorprese a cui tuttə sono invitatə: un viaggio di riscoperta e follia nell'universo queer di Las Marikarmen."
  de: "Videoprojektionen, Licht und eine Nebelsäule mit LEDs, programmiert im Takt des Beats. Wir spielen auf der Bühne und kommen ins Publikum. Eine explosive Live-Show voller Überraschungen, zu der alle eingeladen sind: eine Reise der Wiederentdeckung und des Wahnsinns durch das queere Universum von Las Marikarmen."
  ja: "映像プロジェクション、照明、そしてビートに合わせてプログラムしたLED入りのスモークの柱。ステージで演奏し、客席にも降りていきます。驚きに満ちた爆発的なライブで、誰もが招待されています。Las Marikarmenのクィアな宇宙をめぐる、再発見と狂気の旅へ。"
show_p2:
  es: Cada concierto es un ritual cargado de simbolismo y humor crítico contra el heteropatriarcado y la cisnormalidad. Salimos de él con más purpurina y más aliades.
  en: "Every concert is a ritual full of symbolism and critical humour against heteropatriarchy and cisnormativity. We all leave with more glitter and more allies."
  ca: "Cada concert és un ritual carregat de simbolisme i humor crític contra l'heteropatriarcat i la cisnormativitat. En sortim amb més purpurina i més aliadis."
  gl: "Cada concerto é un ritual cargado de simbolismo e humor crítico contra o heteropatriarcado e a cisnormatividade. Saímos del con máis purpurina e máis aliades."
  eu: "Kontzertu bakoitza sinbolismoz eta umore kritikoz betetako errituala da, heteropatriarkatuaren eta zisnormaltasunaren aurka. Purpurina gehiagorekin eta aliatu gehiagorekin ateratzen gara."
  pt: "Cada concerto é um ritual carregado de simbolismo e humor crítico contra o heteropatriarcado e a cisnormatividade. Saímos de lá com mais brilhantes e mais aliades."
  fr: "Chaque concert est un rituel chargé de symbolisme et d'humour critique contre l'hétéropatriarcat et la cisnormativité. On en ressort avec plus de paillettes et plus d'allié·es."
  it: "Ogni concerto è un rito carico di simbolismo e di umorismo critico contro l'eteropatriarcato e la cisnormatività. Ne usciamo con più brillantini e più alleatə."
  de: "Jedes Konzert ist ein Ritual voller Symbolik und kritischem Humor gegen das Heteropatriarchat und die Cisnormativität. Wir gehen alle mit mehr Glitzer und mehr Verbündeten raus."
  ja: "どのライブも、異性愛家父長制とシスノーマティビティに向けた象徴と批評的ユーモアに満ちた儀式です。終わるころには、みんなグリッターも仲間も増えています。"
