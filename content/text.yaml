bio_p1:
  es: "<b>Las Marikarmen</b> es una banda travesti nutrida del transfeminismo y lo queer. Mezclamos música, performance y vivencias: hip-hop y trap con pop electrónico, dos saxos y un clarinete en directo, drag, proyecciones de vídeo y niebla programada al beat."
  en: "<b>Las Marikarmen</b> is a drag band fed by transfeminism and queerness. We mix music, performance and lived experience: hip-hop and trap with electronic pop, two saxophones and a clarinet played live, drag, video projections and fog programmed to the beat."
  ca: "<b>Las Marikarmen</b> és una banda travesti nodrida del transfeminisme i el queer. Barregem música, performance i vivències: hip-hop i trap amb pop electrònic, dos saxos i un clarinet en directe, drag, projeccions de vídeo i boira programada al ritme del beat."
  gl: "<b>Las Marikarmen</b> é unha banda travesti nutrida do transfeminismo e do queer. Mesturamos música, performance e vivencias: hip-hop e trap con pop electrónico, dous saxos e un clarinete en directo, drag, proxeccións de vídeo e néboa programada ao ritmo do beat."
  eu: "<b>Las Marikarmen</b> transfeminismoaz eta queerraz elikatutako talde trabestia da. Musika, performancea eta bizipenak nahasten ditugu: hip-hop eta trap pop elektronikoarekin, zuzeneko bi saxofoi eta klarinete bat, drag-a, bideo-proiekzioak eta beat-aren erritmora programatutako lainoa."
  pt: "<b>Las Marikarmen</b> é uma banda travesti nutrida pelo transfeminismo e pelo queer. Misturamos música, performance e vivências: hip-hop e trap com pop eletrónico, dois saxofones e um clarinete ao vivo, drag, projeções de vídeo e nevoeiro programado ao ritmo do beat."
  fr: "<b>Las Marikarmen</b> est un groupe drag nourri de transféminisme et de queer. Nous mélangeons musique, performance et vécu : hip-hop et trap avec de la pop électronique, deux saxophones et une clarinette en live, du drag, des projections vidéo et du brouillard programmé sur le beat."
  it: "<b>Las Marikarmen</b> è una band drag nutrita dal transfemminismo e dal queer. Mescoliamo musica, performance ed esperienze vissute: hip-hop e trap con pop elettronico, due sassofoni e un clarinetto dal vivo, drag, proiezioni video e nebbia programmata a tempo di beat."
  de: "<b>Las Marikarmen</b> ist eine Drag-Band, genährt von Transfeminismus und Queerness. Wir mischen Musik, Performance und Erlebtes: Hip-Hop und Trap mit Elektropop, zwei Saxofone und eine Klarinette live, Drag, Videoprojektionen und Nebel im Takt des Beats."
  ja: "<b>Las Marikarmen</b>は、トランスフェミニズムとクィアに育まれたドラァグバンドです。音楽、パフォーマンス、そして生きてきた経験を混ぜ合わせます。ヒップホップやトラップにエレクトロポップ、サックス2本とクラリネット1本の生演奏、ドラァグ、映像プロジェクション、ビートに合わせてプログラムしたスモーク。"
bio_p2:
  es: "Nacimos en 2017 para dar un espacio a las identidades disidentes en la ruralidad de Collserola (Barcelona). Nos organizamos de forma horizontal, sin jerarquías, y llevamos esa idea al escenario: todes cantamos, tocamos, hacemos perfo, vídeo, bailoteo… ¡y lo que haga falta!"
  en: "We were born in 2017 to make room for dissident identities in rural Collserola (Barcelona). We organise horizontally, without hierarchies, and take that idea on stage: we all sing, play, perform, make video, dance… and whatever else it takes!"
  ca: "Vam néixer el 2017 per donar espai a les identitats dissidents a la ruralitat de Collserola (Barcelona). Ens organitzem de manera horitzontal, sense jerarquies, i portem aquesta idea a l'escenari: totis cantem, toquem, fem perfo, vídeo, ballem… i el que calgui!"
  gl: "Nacemos en 2017 para darlles espazo ás identidades disidentes na ruralidade de Collserola (Barcelona). Organizámonos de forma horizontal, sen xerarquías, e levamos esa idea ao escenario: todes cantamos, tocamos, facemos perfo, vídeo, bailoteo… e o que faga falta!"
  eu: "2017an jaio ginen, Collserolako landa-eremuan (Bartzelona) identitate disidenteei espazio bat emateko. Modu horizontalean antolatzen gara, hierarkiarik gabe, eta ideia hori eszenatokira eramaten dugu: denok abesten, jotzen, perfo egiten, bideoa egiten, dantzan… eta behar den guztia!"
  pt: "Nascemos em 2017 para dar espaço às identidades dissidentes na ruralidade de Collserola (Barcelona). Organizamo-nos de forma horizontal, sem hierarquias, e levamos essa ideia para o palco: todes cantamos, tocamos, fazemos performance, vídeo, dançamos… e o que for preciso!"
  fr: "Nous sommes né·es en 2017 pour donner un espace aux identités dissidentes dans la ruralité de Collserola (Barcelone). Nous nous organisons de façon horizontale, sans hiérarchie, et nous portons cette idée sur scène : toustes, nous chantons, jouons, performons, faisons de la vidéo, dansons… et tout ce qu'il faut !"
  it: "Siamo natə nel 2017 per dare spazio alle identità dissidenti nella ruralità di Collserola (Barcellona). Ci organizziamo in modo orizzontale, senza gerarchie, e portiamo questa idea sul palco: tuttə cantiamo, suoniamo, facciamo performance, video, balliamo… e tutto ciò che serve!"
  de: "Wir sind 2017 entstanden, um dissidenten Identitäten im ländlichen Collserola (Barcelona) einen Raum zu geben. Wir organisieren uns horizontal, ohne Hierarchien, und bringen diese Idee auf die Bühne: Alle singen, spielen, performen, machen Video, tanzen… und was sonst noch nötig ist!"
  ja: "2017年、バルセロナ郊外の農村地帯コイセロラで、規範からはみ出すアイデンティティの居場所をつくるために結成しました。上下関係のない水平な組織で、その考え方をそのままステージへ。全員が歌い、演奏し、パフォーマンスし、映像をつくり、踊ります…必要なことはなんでも！"
bio_p3:
  es: "En la house of Marikarmen tenemos a nuestra madre, <b>Lady Marikarmen</b>, gran pionera del mundo transfeminista. Tras su muerte, honramos su legado y continuamos su lucha: abrazar antiguas formas de vida queer que fueron erradicadas y destruir el heteropatriarcado, la cisnormalidad y el binarismo obligado."
  en: "In the house of Marikarmen we have our mother, <b>Lady Marikarmen</b>, a great pioneer of the transfeminist world. Since her death we honour her legacy and carry on her fight: embracing old queer ways of life that were wiped out, and destroying heteropatriarchy, cisnormativity and compulsory binarism."
  ca: "A la house of Marikarmen tenim la nostra mare, <b>Lady Marikarmen</b>, gran pionera del món transfeminista. Després de la seva mort, honorem el seu llegat i continuem la seva lluita: abraçar antigues formes de vida queer que van ser eradicades i destruir l'heteropatriarcat, la cisnormativitat i el binarisme obligat."
  gl: "Na house of Marikarmen temos a nosa nai, <b>Lady Marikarmen</b>, gran pioneira do mundo transfeminista. Tras a súa morte, honramos o seu legado e continuamos a súa loita: abrazar antigas formas de vida queer que foron erradicadas e destruír o heteropatriarcado, a cisnormatividade e o binarismo obrigado."
  eu: "House of Marikarmenen gure ama dugu, <b>Lady Marikarmen</b>, mundu transfeministako aitzindari handia. Hil zenetik, haren ondarea omentzen dugu eta haren borrokari eusten diogu: errotik kendu zituzten antzinako bizimodu queerrak besarkatu, eta heteropatriarkatua, zisnormaltasuna eta derrigorrezko binarismoa suntsitu."
  pt: "Na house of Marikarmen temos a nossa mãe, <b>Lady Marikarmen</b>, grande pioneira do mundo transfeminista. Desde a sua morte, honramos o seu legado e continuamos a sua luta: abraçar antigas formas de vida queer que foram erradicadas e destruir o heteropatriarcado, a cisnormatividade e o binarismo obrigatório."
  fr: "Dans la house of Marikarmen, il y a notre mère, <b>Lady Marikarmen</b>, grande pionnière du monde transféministe. Depuis sa mort, nous honorons son héritage et poursuivons sa lutte : embrasser d'anciennes formes de vie queer qui ont été éradiquées et détruire l'hétéropatriarcat, la cisnormativité et la binarité obligatoire."
  it: "Nella house of Marikarmen c'è nostra madre, <b>Lady Marikarmen</b>, grande pioniera del mondo transfemminista. Dopo la sua morte onoriamo la sua eredità e portiamo avanti la sua lotta: abbracciare antiche forme di vita queer che furono sradicate e distruggere l'eteropatriarcato, la cisnormatività e il binarismo obbligatorio."
  de: "Im House of Marikarmen haben wir unsere Mutter, <b>Lady Marikarmen</b>, eine große Pionierin der transfeministischen Welt. Seit ihrem Tod ehren wir ihr Vermächtnis und führen ihren Kampf weiter: alte queere Lebensformen umarmen, die ausgelöscht wurden, und das Heteropatriarchat, die Cisnormativität und den Zwang zur Binarität zerstören."
  ja: "ハウス・オブ・マリカルメン（ボールルーム文化でいう「ハウス」、つまり自分たちで選んだ家族）には、母<b>レディ・マリカルメン</b>がいます。トランスフェミニズムの世界の偉大な先駆者です。彼女が亡くなった今、わたしたちはその遺志を受け継ぎ、闘いを続けています。根絶やしにされた古いクィアな生き方を抱きしめ、異性愛家父長制、シスノーマティビティ、そして押しつけられた二元論を壊すために。"
