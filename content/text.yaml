workshop_intro:
  es: Un viaje por la historia del drag y una puesta en práctica. Cada participante construye su personaje con juegos de teatro, vestuario y maquillaje, y lo lleva a la pasarela.
  en: "A journey through drag history, put into practice. Each participant builds their character with theatre games, costume and make-up, and takes it to the runway."
  ca: "Un viatge per la història del drag i una posada en pràctica. Cada participant construeix el seu personatge amb jocs de teatre, vestuari i maquillatge, i el porta a la passarel·la."
  gl: "Unha viaxe pola historia do drag e unha posta en práctica. Cada participante constrúe a súa personaxe con xogos de teatro, vestiario e maquillaxe, e lévaa á pasarela."
  eu: "Drag-aren historian zeharreko bidaia eta haren praktika. Partaide bakoitzak bere pertsonaia eraikitzen du antzerki-jokoekin, jantziekin eta makillajearekin, eta pasarelara eramaten du."
  pt: "Uma viagem pela história do drag e a sua prática. Cada participante constrói a sua personagem com jogos de teatro, figurino e maquilhagem, e leva-a para a passerelle."
  fr: "Un voyage dans l'histoire du drag et sa mise en pratique. Chaque participant·e construit son personnage avec des jeux de théâtre, du costume et du maquillage, et l'amène sur le runway."
  it: "Un viaggio nella storia del drag e la sua messa in pratica. Ogni partecipante costruisce il proprio personaggio con giochi teatrali, costumi e trucco, e lo porta in passerella."
  de: "Eine Reise durch die Geschichte des Drag und ihre Umsetzung in die Praxis. Alle Teilnehmenden bauen mit Theaterspielen, Kostüm und Make-up ihre Figur und bringen sie auf den Runway."
  ja: "ドラァグの歴史をたどり、実際にやってみる旅。参加者それぞれが演劇ゲーム、衣装、メイクで自分のキャラクターをつくり、ランウェイを歩きます。"
