# Las Marikarmen — all translatable web text.
# Same keys as the press-kit master text where they exist, so both can be merged.
# Each key: es (source) + one line per language (en, ca, gl, eu, pt, fr, it, de, ja).
# A missing language falls back to es and is listed by `python3 build.py --check`.
# Basic HTML is allowed: <b>, <em>, <br>. Names stay in site.yaml (never translated).

