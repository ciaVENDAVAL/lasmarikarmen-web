meta_description:
  es: Las Marikarmen, banda travesti transfeminista y queer de Barcelona. Hip-hop electrónico con saxos y clarinete en directo, drag, vídeo y niebla al beat.
  en: "Las Marikarmen, a transfeminist queer drag band from Barcelona. Electronic hip-hop with live saxophones and clarinet, drag, video and fog on the beat."
  ca: "Las Marikarmen, banda travesti transfeminista i queer de Barcelona. Hip-hop electrònic amb saxos i clarinet en directe, drag, vídeo i boira al ritme del beat."
  gl: "Las Marikarmen, banda travesti transfeminista e queer de Barcelona. Hip-hop electrónico con saxos e clarinete en directo, drag, vídeo e néboa ao ritmo do beat."
  eu: "Las Marikarmen, Bartzelonako talde trabesti transfeminista eta queerra. Hip-hop elektronikoa zuzeneko saxofoi eta klarinetearekin, drag-a, bideoa eta lainoa beat-aren erritmora."
  pt: "Las Marikarmen, banda travesti transfeminista e queer de Barcelona. Hip-hop eletrónico com saxofones e clarinete ao vivo, drag, vídeo e nevoeiro ao ritmo do beat."
  fr: "Las Marikarmen, groupe drag transféministe et queer de Barcelone. Hip-hop électronique avec saxophones et clarinette en live, drag, vidéo et brouillard sur le beat."
  it: "Las Marikarmen, band drag transfemminista e queer di Barcellona. Hip-hop elettronico con sassofoni e clarinetto dal vivo, drag, video e nebbia a tempo di beat."
  de: "Las Marikarmen, transfeministische Queer-Drag-Band aus Barcelona. Elektronischer Hip-Hop mit Live-Saxofonen und Klarinette, Drag, Video und Nebel im Takt."
  ja: "Las Marikarmen（ラス・マリカルメン）は、バルセロナのトランスフェミニスト・クィアなドラァグバンド。サックスとクラリネットの生演奏にエレクトロ・ヒップホップ、ドラァグ、映像、ビートに合わせたスモーク。"
