motto_vic:
  es: me se sale el huevo de la falda
motto_hipo:
  es: todo éxitos
motto_conta:
  es: vivo en un mundo paralelo
bio_vic:
  es: Barriobajere choni multidisciplinar. Se hace paso al caminar. Atrapade en un eterno loop por conseguir joyas. Sus genitales son incapaces de mantenerse dentro de una falda. Además acróbata, muy carismátique y llenísime de autotune.
bio_hipo:
  es: Ser mitológico vasco que nunca sabe dónde está porque no se orienta. Sus ondas de choque muelen machos en la tierra y ellos pierden la memoria cuando suena el clarinete.
bio_conta:
  es: Criatura nobinaria llegada desde el espacio intergaláctico que fue encontrada viviendo bajo un árbol en Japón. Ama la papiroflexia y el coco. Sus cejas son al mismo tiempo alas y transmisores de radio interplanetario. Toca el saxo para entrenar sus pulmones y así sobrevivir en esta atmósfera.

# ───────── show ─────────
show_kicker:
  es: El espectáculo · 60 min
show_deck:
  es: El funeral folclórico de Lady Marikarmen se convierte en <b>una fiesta multimedia</b> de hip-hop electrónico, vientos y travestismo.
show_p1:
  es: "Proyecciones de vídeo, luces y una columna de niebla con LEDs programada al ritmo del beat. Tocamos encima del escenario y bajamos al público. Un directo explosivo y lleno de sorpresas al que todo el mundo está invitade: un viaje de redescubrimiento y locura por el universo queer de Las Marikarmen."
show_p2:
  es: Cada concierto es un ritual cargado de simbolismo y humor crítico contra el heteropatriarcado y la cisnormalidad. Salimos de él con más purpurina y más aliades.
funeral_alt:
  es: Las Marikarmen en directo, con el retrato de Lady Marikarmen entre flores
quote_contamina:
  es: Cogemos a los hombres cis, los ponemos al sol y lloran.
  ca: Agafem els homes cis, els posem al sol i ploren.
quote_contamina_src:
  es: Contàmina Perpétua en betevé, 2021
