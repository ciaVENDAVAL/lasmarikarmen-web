# ───────── contact ─────────
contact_invite:
  es: Si quieres un <b>concierto teatral</b> o un <b>taller de drag</b>, o simplemente te falta alguien para escucharte, llámanos.
  en: "If you want a <b>theatrical concert</b> or a <b>drag workshop</b>, or you just need someone to listen to you, call us."
  ca: "Si vols un <b>concert teatral</b> o un <b>taller de drag</b>, o simplement et falta algú que t'escolti, truca'ns."
  gl: "Se queres un <b>concerto teatral</b> ou un <b>obradoiro de drag</b>, ou simplemente che falta alguén que te escoite, chámanos."
  eu: "<b>Kontzertu teatral</b> bat edo <b>drag tailer</b> bat nahi baduzu, edo besterik gabe entzungo dizun norbait falta bazaizu, deitu iezaguzu."
  pt: "Se queres um <b>concerto teatral</b> ou uma <b>oficina de drag</b>, ou simplesmente te falta alguém que te ouça, liga-nos."
  fr: "Si tu veux un <b>concert théâtral</b> ou un <b>atelier drag</b>, ou si tu as simplement besoin de quelqu'un pour t'écouter, appelle-nous."
  it: "Se vuoi un <b>concerto teatrale</b> o un <b>laboratorio drag</b>, o semplicemente ti manca qualcunə che ti ascolti, chiamaci."
  de: "Wenn du ein <b>theatrales Konzert</b> oder einen <b>Drag-Workshop</b> willst, oder dir einfach jemand zum Zuhören fehlt, ruf uns an."
  ja: "<b>演劇的なライブ</b>や<b>ドラァグ・ワークショップ</b>をご希望の方、ただ話を聞いてくれる誰かがほしい方も、お気軽にご連絡ください。"
