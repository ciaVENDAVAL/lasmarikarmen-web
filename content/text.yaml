home_intro:
  es: "Somos Las Marikarmen, pura energía queer punk que mezcla electrónica con el power de dos saxos y un clarinete en vivo. Canalizamos activismo desde Euskadi, Leganés y un nomadismo nórdico, y lo mezclamos en Collserola con performance y una explosión sonora que desafía todas las etiquetas de géneros. Esto no es solo música: es un statement, un espectáculo, un viaje."
