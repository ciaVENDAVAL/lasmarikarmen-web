quote_kaos:
  es: Nos regocijamos en el odio que nos transmite la sociedad y lo transformamos en empoderamiento y amor personal.
  en: "We revel in the hatred society throws at us and turn it into empowerment and self-love."
  ca: "Gaudim de l'odi que ens transmet la societat i el transformem en apoderament i amor propi."
  de: "Wir schwelgen im Hass, den die Gesellschaft uns entgegenbringt, und verwandeln ihn in Empowerment und Selbstliebe."
  it: "Godiamo dell'odio che la società ci trasmette e lo trasformiamo in empowerment e amore per noi stessə."
  fr: "Nous nous délectons de la haine que la société nous renvoie et nous la transformons en empowerment et en amour de soi."
  eu: "Gizarteak transmititzen digun gorrotoaz gozatzen dugu eta ahalduntze eta norberarenganako maitasun bihurtzen dugu."
quote_kaos_src:
  es: entrevista, 2020
  en: "interview, 2020"
  ca: "entrevista, 2020"
  de: "Interview, 2020"
  it: "intervista, 2020"
  fr: "entretien, 2020"
  eu: "elkarrizketa, 2020"
quote_rutalokal:
  es: "Musicalmente, se hacen un hueco dentro de la escena emergente del nuevo punk (autotune, rabia y maquineo), combinando ritmos partios’ andaluces, música vasca y el sonido de los saxofones y el clarinete que caracterizan tanto a la banda en sí."
  en: "Musically, they carve out a place in the emerging new punk scene (autotune, rage and machine beats), combining Andalusian broken rhythms, Basque music and the sound of the saxophones and clarinet that so define the band."
  ca: "Musicalment, es fan un lloc dins l'escena emergent del nou punk (autotune, ràbia i maquineo), combinant ritmes trencats andalusos, música basca i el so dels saxòfons i el clarinet que tant caracteritzen la banda."
  de: "Musikalisch finden sie ihren Platz in der aufstrebenden Szene des neuen Punk (Autotune, Wut und Maschinenbeats) und verbinden andalusische gebrochene Rhythmen, baskische Musik und den Klang der Saxofone und der Klarinette, die die Band so prägen."
  it: "Musicalmente si ritagliano uno spazio nella scena emergente del nuovo punk (autotune, rabbia e beat da macchina), unendo ritmi spezzati andalusi, musica basca e il suono dei sassofoni e del clarinetto che tanto caratterizzano la band."
  fr: "Musicalement, elles se font une place dans la scène émergente du nouveau punk (autotune, rage et beats machine), en combinant rythmes cassés andalous, musique basque et le son des saxophones et de la clarinette qui caractérisent tant le groupe."
  eu: "Musikalki, punk berriaren eszena sortu berrian egiten dute toki (autotunea, amorrua eta makina-erritmoak), Andaluziako erritmo hautsiak, euskal musika eta taldea hainbeste ezaugarritzen duten saxofoien eta klarinetearen soinua uztartuz."
quote_beteve:
  es: Una banda performativa llamada a minar el heteropatriarcado, romper con el relato de la cisnormalidad y poner fin al reduccionismo del binarismo.
  en: "A performative band set on undermining heteropatriarchy, breaking the narrative of cisnormativity and ending the reductionism of binarism."
  ca: Una banda performativa cridada a minar l’heteropatriarcat, trencar amb el relat de la cisnormalitat i posar fi al reduccionisme d’un binarisme.
  de: "Eine performative Band, angetreten, um das Heteropatriarchat zu untergraben, mit dem Narrativ der Cisnormativität zu brechen und dem Reduktionismus der Binarität ein Ende zu setzen."
  it: "Una band performativa chiamata a minare l'eteropatriarcato, rompere il racconto della cisnormatività e porre fine al riduzionismo del binarismo."
  fr: "Un groupe performatif appelé à saper l'hétéropatriarcat, rompre avec le récit de la cisnormativité et mettre fin au réductionnisme de la binarité."
  eu: "Heteropatriarkatua ahultzera, zisnormaltasunaren kontakizuna haustera eta binarismoaren erredukzionismoari amaiera ematera deitutako talde performatiboa."
quote_vic:
  es: Una banda queer que introduce conceptos pop, balcánicos, beats, vestuario, maquillaje y también un poco de nosotres.
  en: "A queer band bringing in pop and Balkan ideas, beats, costume, make-up and a little bit of ourselves too."
  ca: Una banda queer, que introdueix conceptes pop, balcànics, beats, vestuari, maquillatge i també una mica de nosaltres.
  de: "Eine queere Band, die Pop- und Balkan-Ideen, Beats, Kostüm, Make-up und auch ein bisschen von uns selbst einbringt."
  it: "Una band queer che porta idee pop, balcaniche, beat, costumi, trucco e anche un po' di noi."
  fr: "Un groupe queer qui apporte des idées pop, balkaniques, des beats, du costume, du maquillage et aussi un peu de nous."
  eu: "Pop eta Balkanetako ideiak, beat-ak, jantziak, makillajea eta gutako zerbait ere ekartzen dituen talde queerra."
quote_enderrock:
  es: Tiene un directo performativo e interactivo que se convierte en una celebración de las identidades disidentes, un espacio de cuidados y amor…
  en: "Its performative, interactive live show becomes a celebration of dissident identities, a space of care and love…"
  ca: "Té un directe performatiu i interactiu que es converteix en una celebració de les identitats dissidents, un espai de cures i amor…"
  de: "Ihre performative, interaktive Live-Show wird zu einem Fest der dissidenten Identitäten, einem Raum der Fürsorge und der Liebe…"
  it: "Ha un live performativo e interattivo che diventa una celebrazione delle identità dissidenti, uno spazio di cura e di amore…"
  fr: "Son live performatif et interactif devient une célébration des identités dissidentes, un espace de soin et d'amour…"
  eu: "Zuzeneko performatibo eta interaktiboa du, identitate disidenteen ospakizun bihurtzen dena, zaintza- eta maitasun-gune bat…"
