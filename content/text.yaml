quote_heart:
  es: Hay mucho que deconstruir, repensar, reciclar, compostar… y nosotres lo hacemos desde nuestro pequeño corazón.
  en: "There's a lot to deconstruct, rethink, recycle, compost… and we do it from our little heart."
  ca: Hi ha molt a deconstruir, repensar, reciclar, compostar… i nosaltres ho fem des del nostre petit cor.
  de: "Es gibt viel zu dekonstruieren, zu überdenken, zu recyceln, zu kompostieren… und wir tun es aus unserem kleinen Herzen."
  it: "C'è tanto da decostruire, ripensare, riciclare, compostare… e noi lo facciamo dal nostro piccolo cuore."
  fr: "Il y a tant à déconstruire, repenser, recycler, composter… et nous le faisons avec notre petit cœur."
  eu: "Asko dago deseraikitzeko, berpentsatzeko, birziklatzeko, konpostatzeko… eta guk gure bihotz txikitik egiten dugu."
workshop_text:
  es: <b>2000 años de Drag Kings, Queens &amp; Monsters.</b> Historia del drag, juegos de teatro, vestuario, maquillaje, runway y actuaciones de les participantes. 3 h (+1 h con actuación pública) · 10–20 personas · 16+.
  en: "<b>2000 Years of Drag Kings, Queens &amp; Monsters.</b> Drag history, theatre games, costume, make-up, runway and performances by the participants. 3 h (+1 h with public show) · 10–20 people · 16+."
  ca: "<b>2000 anys de Drag Kings, Queens &amp; Monsters.</b> Història del drag, jocs de teatre, vestuari, maquillatge, runway i actuacions de lis participants. 3 h (+1 h amb actuació pública) · 10–20 persones · 16+."
  de: "<b>2000 Jahre Drag Kings, Queens &amp; Monsters.</b> Drag-Geschichte, Theaterspiele, Kostüm, Make-up, Runway und Auftritte der Teilnehmenden. 3 Std. (+1 Std. mit öffentlichem Auftritt) · 10–20 Personen · ab 16."
  it: "<b>2000 anni di Drag Kings, Queens &amp; Monsters.</b> Storia del drag, giochi teatrali, costumi, trucco, runway ed esibizioni dellə partecipanti. 3 h (+1 h con esibizione pubblica) · 10–20 persone · 16+."
  fr: "<b>2000 ans de Drag Kings, Queens &amp; Monsters.</b> Histoire du drag, jeux de théâtre, costume, maquillage, runway et performances des participant·es. 3 h (+1 h avec performance publique) · 10–20 personnes · 16+."
  eu: "<b>2000 urteko Drag Kings, Queens &amp; Monsters.</b> Drag-aren historia, antzerki-jokoak, jantziak, makillajea, runway-a eta partaideen emanaldiak. 3 h (+1 h emanaldi publikoarekin) · 10–20 pertsona · 16+."
