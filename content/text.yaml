bio_vic:
  es: Barriobajere choni multidisciplinar. Se hace paso al caminar. Atrapade en un eterno loop por conseguir joyas. Sus genitales son incapaces de mantenerse dentro de una falda. Además acróbata, muy carismátique y llenísime de autotune.
  en: "Multidisciplinary street choni. Struts when walking. Trapped in an endless loop of hunting for jewellery. Their genitals can't stay inside a skirt. Also an acrobat, super charismatic and dripping with autotune."
  ca: "Barriobajeri choni multidisciplinari. Es fa pas en caminar. Atrapadi en un loop etern per aconseguir joies. Els seus genitals són incapaços de quedar-se dins d'una faldilla. A més acròbata, molt carismàtiqui i pleni d'autotune."
  de: "Multidisziplinäre Vorstadt-Choni. Macht sich beim Gehen Platz. Gefangen in einer endlosen Schleife auf der Jagd nach Schmuck. Deren Genitalien bleiben einfach nicht im Rock. Außerdem Akrobat*in, sehr charismatisch und randvoll mit Autotune."
  it: "Coattə multidisciplinare di periferia. Si fa largo camminando. Intrappolatə in un loop eterno a caccia di gioielli. I suoi genitali non riescono a restare dentro una gonna. In più acrobata, carismaticissimə e pienə di autotune."
  fr: "Racaille choni multidisciplinaire. Se fraie un chemin en marchant. Coincé·e dans une boucle éternelle à la chasse aux bijoux. Ses parties génitales n'arrivent pas à rester dans une jupe. Acrobate en plus, très charismatique et bourré·e d'autotune."
  eu: "Auzo-txoni diziplina anitzekoa. Ibiltzean bidea zabaltzen du. Bitxien bila begizta amaigabe batean harrapatuta. Bere genitalak ezin dira gona baten barruan geratu. Gainera akrobata, oso karismatikoa eta autotunez beteta."
bio_hipo:
  es: Ser mitológico vasco que nunca sabe dónde está porque no se orienta. Sus ondas de choque muelen machos en la tierra y ellos pierden la memoria cuando suena el clarinete.
  en: "A mythological Basque creature who never knows where she is because she has no sense of direction. Her shockwaves grind machos into the ground, and they lose their memory when the clarinet plays."
  ca: "Ésser mitològic basc que mai no sap on és perquè no s'orienta. Les seves ones de xoc moen mascles a terra i ells perden la memòria quan sona el clarinet."
  de: "Ein baskisches Fabelwesen, das nie weiß, wo es ist, weil es keinen Orientierungssinn hat. Ihre Schockwellen mahlen Machos in den Boden, und sie verlieren ihr Gedächtnis, sobald die Klarinette erklingt."
  it: "Essere mitologico basco che non sa mai dove si trova perché non ha senso dell'orientamento. Le sue onde d'urto macinano machi nel terreno, e loro perdono la memoria quando suona il clarinetto."
  fr: "Créature mythologique basque qui ne sait jamais où elle est parce qu'elle n'a aucun sens de l'orientation. Ses ondes de choc broient les machos dans la terre, et ils perdent la mémoire quand sonne la clarinette."
  eu: "Inoiz non dagoen ez dakien euskal izaki mitologikoa, ez baitu orientaziorik. Bere talka-uhinek matxoak lurrean xehatzen dituzte, eta haiek oroimena galtzen dute klarinetea jotzen denean."
bio_conta:
  es: Criatura nobinaria llegada desde el espacio intergaláctico que fue encontrada viviendo bajo un árbol en Japón. Ama la papiroflexia y el coco. Sus cejas son al mismo tiempo alas y transmisores de radio interplanetario. Toca el saxo para entrenar sus pulmones y así sobrevivir en esta atmósfera.
  en: "A non-binary creature from intergalactic space, found living under a tree in Japan. Loves origami and coconut. Their eyebrows are both wings and interplanetary radio transmitters. They play the sax to train their lungs and survive in this atmosphere."
  ca: "Criatura no binària arribada de l'espai intergalàctic, trobada vivint sota un arbre al Japó. Estima la papiroflèxia i el coco. Les seves celles són alhora ales i transmissors de ràdio interplanetària. Toca el saxo per entrenar els pulmons i així sobreviure en aquesta atmosfera."
  de: "Nichtbinäres Wesen aus dem intergalaktischen Raum, gefunden unter einem Baum in Japan. Liebt Origami und Kokosnuss. Deren Augenbrauen sind zugleich Flügel und interplanetare Funksender. Spielt Saxofon, um die Lunge zu trainieren und in dieser Atmosphäre zu überleben."
  it: "Creatura non binaria arrivata dallo spazio intergalattico, trovata a vivere sotto un albero in Giappone. Ama l'origami e il cocco. Le sue sopracciglia sono insieme ali e trasmettitori radio interplanetari. Suona il sax per allenare i polmoni e sopravvivere in questa atmosfera."
  fr: "Créature non binaire venue de l'espace intergalactique, trouvée vivant sous un arbre au Japon. Adore l'origami et la noix de coco. Ses sourcils sont à la fois des ailes et des émetteurs radio interplanétaires. Joue du saxo pour entraîner ses poumons et ainsi survivre dans cette atmosphère."
  eu: "Espazio intergalaktikotik iritsitako izaki ez-bitarra, Japonian zuhaitz baten azpian bizitzen aurkitua. Papiroflexia eta kokoa maite ditu. Bere bekainak hegoak eta planetarteko irrati-igorleak dira aldi berean. Saxoa jotzen du birikak entrenatzeko eta atmosfera honetan bizirik irauteko."

