home_intro:
  es: "Somos Las Marikarmen, pura energía queer punk que mezcla electrónica con el power de dos saxos y un clarinete en vivo. Canalizamos activismo desde Euskadi, Leganés y un nomadismo nórdico, y lo mezclamos en Collserola con performance y una explosión sonora que desafía todas las etiquetas de géneros. Esto no es solo música: es un statement, un espectáculo, un viaje."
  en: "We are Las Marikarmen, pure queer punk energy mixing electronics with the power of two saxophones and a clarinet played live. We channel activism from the Basque Country, Leganés and a Nordic nomad life, and mix it in Collserola with performance and a sonic explosion that defies every genre label. This isn't just music: it's a statement, a show, a journey."
  ca: "Som Las Marikarmen, pura energia queer punk que barreja electrònica amb el power de dos saxos i un clarinet en directe. Canalitzem activisme des d'Euskadi, Leganés i un nomadisme nòrdic, i ho barregem a Collserola amb performance i una explosió sonora que desafia totes les etiquetes de gèneres. Això no és només música: és un statement, un espectacle, un viatge."
  gl: "Somos Las Marikarmen, pura enerxía queer punk que mestura electrónica co power de dous saxos e un clarinete en directo. Canalizamos activismo dende Euskadi, Leganés e un nomadismo nórdico, e mesturámolo en Collserola con performance e unha explosión sonora que desafía todas as etiquetas de xéneros. Isto non é só música: é un statement, un espectáculo, unha viaxe."
  eu: "Las Marikarmen gara, queer punk energia hutsa, elektronika eta zuzeneko bi saxofoi eta klarinete baten indarra nahasten dituena. Euskal Herritik, Leganésetik eta nomadismo nordiko batetik datorren aktibismoa bideratzen dugu, eta Collserolan nahasten dugu performancearekin eta genero-etiketa guztiei desafio egiten dien soinu-leherketa batekin. Hau ez da musika soilik: statement bat da, ikuskizun bat, bidaia bat."
  pt: "Somos Las Marikarmen, pura energia queer punk que mistura eletrónica com a força de dois saxofones e um clarinete ao vivo. Canalizamos ativismo do País Basco, de Leganés e de um nomadismo nórdico, e misturamo-lo em Collserola com performance e uma explosão sonora que desafia todos os rótulos de género. Isto não é só música: é um statement, um espetáculo, uma viagem."
  fr: "Nous sommes Las Marikarmen, pure énergie queer punk qui mêle l'électro à la puissance de deux saxophones et d'une clarinette en live. Nous canalisons un activisme venu du Pays basque, de Leganés et d'un nomadisme nordique, et nous le mixons à Collserola avec de la performance et une explosion sonore qui défie toutes les étiquettes de genre. Ce n'est pas que de la musique : c'est un statement, un spectacle, un voyage."
  it: "Siamo Las Marikarmen, pura energia queer punk che mescola l'elettronica con la potenza di due sassofoni e un clarinetto dal vivo. Canalizziamo attivismo dai Paesi Baschi, da Leganés e da un nomadismo nordico, e lo mescoliamo a Collserola con performance e un'esplosione sonora che sfida ogni etichetta di genere. Questa non è solo musica: è uno statement, uno spettacolo, un viaggio."
  de: "Wir sind Las Marikarmen, pure Queer-Punk-Energie, die Elektronik mit der Power von zwei Saxofonen und einer Klarinette live verbindet. Wir kanalisieren Aktivismus aus dem Baskenland, Leganés und einem nordischen Nomadenleben und mischen ihn in Collserola mit Performance und einer Klangexplosion, die jedem Genre- und Gender-Etikett trotzt. Das ist nicht nur Musik: Es ist ein Statement, eine Show, eine Reise."
  ja: "わたしたちはLas Marikarmen。エレクトロに、2本のサックスと1本のクラリネットの生演奏のパワーを混ぜ合わせた、純度100%のクィア・パンク。バスク、レガネス、そして北欧のノマド生活から活動の熱を運び、バルセロナ郊外の山あいコイセロラで、パフォーマンスとあらゆるジャンル（そしてジェンダー）のラベルに挑む音の爆発にミックスしています。これはただの音楽ではありません。ステートメントであり、ショーであり、旅です。"
