# ───────── bio ─────────
bio_tag:
  es: Quiénes somos
bio_title_1:
  es: Bienvenide a la
bio_title_2:
  es: house of Marikarmen
bio_p1:
  es: "<b>Las Marikarmen</b> es una banda travesti nutrida del transfeminismo y lo queer. Mezclamos música, performance y vivencias: hip-hop y trap con pop electrónico, dos saxos y un clarinete en directo, drag, proyecciones de vídeo y niebla programada al beat."
bio_p2:
  es: "Nacimos en 2017 para dar un espacio a las identidades disidentes en la ruralidad de Collserola (Barcelona). Nos organizamos de forma horizontal, sin jerarquías, y llevamos esa idea al escenario: todes cantamos, tocamos, hacemos perfo, vídeo, bailoteo… ¡y lo que haga falta!"
bio_p3:
  es: "En la house of Marikarmen tenemos a nuestra madre, <b>Lady Marikarmen</b>, gran pionera del mundo transfeminista. Tras su muerte, honramos su legado y continuamos su lucha: abrazar antiguas formas de vida queer que fueron erradicadas y destruir el heteropatriarcado, la cisnormalidad y el binarismo obligado."
bio_banner:
  es: ¡Destruir el heteropatriarcado, la cisnormalidad y el binarismo obligado!
lady_caption:
  es: Lady Marikarmen<br>madre de la casa

