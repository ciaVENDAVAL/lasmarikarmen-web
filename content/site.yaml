# Las Marikarmen — web settings and data that does NOT need translating.
# All translatable text lives in content/text.yaml.

# Languages published on the site. The first one is the default and is built
# at the root (/). The others go in /<code>/ (e.g. /ca/talleres.html).
# Add a language here only when its translation in text.yaml is complete —
# `python3 build.py --check` lists what is missing.
languages: [es]
# Full list planned: [es, ca, de, it, fr, eu]

language_names:
  es: Castellano
  ca: Català
  de: Deutsch
  it: Italiano
  fr: Français
  eu: Euskara

# Custom domain. Leave empty while testing on <user>.github.io/<repo>/.
# Set to lasmarikarmen.com when you are ready to move the domain to GitHub Pages.
cname: ""

site_url: https://www.lasmarikarmen.com

# Press kit PDF per language (files in assets/presskit/). Missing ones fall back to es.
presskit:
