# Sveltia CMS config for lasmarikarmen-web — generated by tools/make_config.py — edit that script, not this file.
# Docs: https://sveltiacms.app/en/docs
app_title: Las Marikarmen · web
logo:
  src: /assets/img/favicon.png
backend:
  name: github
  repo: ciaVENDAVAL/lasmarikarmen-web
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: 'Admin: create {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'
site_url: https://www.lasmarikarmen.com/
display_url: https://www.lasmarikarmen.com/
media_folder: assets/img
public_folder: /assets/img
media_libraries:
  default:
    config:
      slugify_filename: false
      max_file_size: 25000000
editor:
  preview: false
output:
  json:
    indent_size: 2
  omit_empty_optional_fields: true
i18n:
  structure: multiple_folders
  locales:
  - es
  - en
  - ca
  - gl
  - eu
  - pt
  - fr
  - it
  - de
  - ja
  default_locale: es
asset_collections:
- name: photos
  label: Fotos
  media_folder: assets/img
  public_folder: /assets/img
  icon: photo_library
- name: posters
  label: Carteles
  media_folder: assets/img/posters
  public_folder: /assets/img/posters
  icon: image
- name: presskit
  label: Press kits (PDF)
  media_folder: assets/presskit
  public_folder: /assets/presskit
  icon: picture_as_pdf
- name: rider
  label: Riders (PDF)
  media_folder: assets/rider
  public_folder: /assets/rider
  icon: picture_as_pdf
singletons:
- name: gigs
  label: Fechas y carteles
  icon: event
  file: content/gigs.json
  fields:
  - name: gigs
    label: Fechas
    widget: list
    collapsed: true
    required: true
    fields:
    - name: date
      label: Fecha
      widget: string
      required: true
      pattern:
      - ^\d{4}(-\d{2}(-\d{2})?)?$
      - AAAA-MM-DD, AAAA-MM o AAAA
    - name: city
      label: Ciudad
      widget: string
      required: false
    - name: venue
      label: Sala / lugar
      widget: string
      required: false
    - name: event
      label: Evento
      widget: string
      required: false
    - name: posters
      label: Carteles
      widget: image
      media_folder: /assets/img/posters
      public_folder: /assets/img/posters
      required: false
      multiple: true
    - name: kind
      label: Tipo
      widget: select
      required: false
      dropdown_threshold: 12
      hint: Vacío = concierto.
      options:
      - label: Radio / tele / entrevista
        value: media
      - label: Disco / recopilatorio
        value: release
    summary: '{{fields.date}} · {{fields.city}} · {{fields.venue}}'
    hint: La más nueva arriba (cualquier orden vale). Fecha AAAA-MM-DD (o AAAA-MM / AAAA si no se sabe el día). Las fechas pasadas se mueven solas a «Lo petamos…» cada noche.
    add_to_top: true
    label_singular: fecha
- name: videos
  label: Vídeos
  icon: smart_display
  file: content/videos.json
  fields:
  - name: hero_video
    label: Vídeo de fondo de la portada
    widget: object
    collapsed: true
    hint: Sin sonido, en bucle, detrás de la foto de la portada. Solo YouTube por ahora.
    fields:
    - name: title
      label: Título
      widget: string
      required: true
    - name: url
      label: Enlace
      widget: string
      required: true
      hint: 'Pega el enlace normal del vídeo: PeerTube (https://…/w/…) o YouTube. Portada: una foto de la propia web (nunca de YouTube).'
  - name: featured_video
    label: Vídeo destacado (Música y portada)
    widget: object
    collapsed: true
    fields:
    - name: title
      label: Título
      widget: string
      required: true
    - name: feat
      label: Con (ft. / prod.)
      widget: string
      required: true
    - name: url
      label: Enlace
      widget: string
      required: true
      hint: 'Pega el enlace normal del vídeo: PeerTube (https://…/w/…) o YouTube. Portada: una foto de la propia web (nunca de YouTube).'
    - name: cover
      label: Foto de portada
      widget: image
      media_folder: /assets/img/video
      public_folder: /assets/img/video
      required: true
  - name: videos
    label: Videoclips
    widget: list
    collapsed: true
    summary: '{{fields.title}}'
    label_singular: vídeo
    hint: El más nuevo primero.
    fields:
