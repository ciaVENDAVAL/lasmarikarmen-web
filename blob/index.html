<style>
/* Layout: one black screen. Slim bar on top, stage fills the space, one row of toggles per blob, one row for chorus and scale. */
:root{
  --ink:#0b0612;
  --ink-2:#1a0f26;
  --mag:#ff00ff;
  --cream:#f7f0ea;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --voice:'Playfair Display','Georgia',serif;
  --mono:'Space Mono','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:13px;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;background:var(--ink)}
.top{flex:none;border-bottom:2px solid var(--mag)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.pennant{display:inline-block;background:var(--mag);color:var(--ink);font-family:var(--voice);font-style:italic;font-weight:500;font-size:20px;line-height:1.2;padding:3px 24px 3px 12px;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);transform:rotate(-2deg)}
.fs{width:38px;height:38px;border:2px solid var(--cream);background:transparent;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fs:hover{background:var(--cream);color:var(--ink)}

.stage-wrap{flex:1 1 0;min-height:320px;padding-block:12px 8px}
.stage{display:block;width:100%;height:100%;border:3px solid var(--mag);background:var(--ink);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.stage:active{cursor:grabbing}

.bar{flex:none;padding-block:4px 14px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{min-width:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.global{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(247,240,234,.25)}

.seg{display:inline-flex;border:2px solid var(--cream)}
.seg button{background:transparent;border:0;border-left:2px solid var(--cream);padding:6px 9px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;cursor:pointer;min-width:0}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--mag);color:var(--ink)}
.seg button:hover:not([aria-pressed="true"]){background:rgba(247,240,234,.16)}

.auto{display:inline-flex;align-items:center;gap:6px;background:transparent;border:2px solid var(--cream);padding:6px 9px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;cursor:pointer;min-width:0}
.auto:hover{background:rgba(247,240,234,.16)}
.led{width:9px;height:9px;border-radius:50%;background:#4a3a52;border:1px solid var(--cream);flex:none}
.auto[data-on="1"]{border-color:var(--mag)}
.auto[data-on="1"] .led{background:var(--mag)}
.pc.is-inst .auto{opacity:.4}

.chorus{background:transparent;border:2px solid var(--cream);padding:7px 14px;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;line-height:1}
.chorus[aria-pressed="true"]{background:var(--mag);border-color:var(--mag);color:var(--ink)}
select{background:var(--ink);border:2px solid var(--cream);padding:6px 8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:0;cursor:pointer}

@media (max-width:520px){
  .seg button,.auto{padding:6px 6px;font-size:10px}
  .chorus{font-size:18px;padding:7px 12px}
}
.pennant{text-decoration:none}
.top .wrap{flex-wrap:wrap}
.credit{margin:0;font-size:10px;letter-spacing:.04em;opacity:.7;flex:1 1 200px;text-align:right}
.credit a{color:inherit}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="wrap">
    <a class="pennant" href="../">Las Marikarmen</a>
    <p class="credit">Blob Marikarmen · inspirado en <a href="https://artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw" rel="noopener">Blob Opera</a> (Google Arts &amp; Culture), sin afiliación</p>
    <button type="button" class="fs" id="fs" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
  </div></header>

  <section class="stage-wrap"><div class="wrap" style="height:100%">
    <canvas id="stage" class="stage" aria-label="Escenario con tres blobs: Victoria Sickness, Hipogrifa y Contàmina Perpétua. Arrastra un blob arriba y abajo para cambiar la nota y a izquierda y derecha para cambiar la vocal. Con el coro activo, los otros dos cantan con él." role="img"></canvas>
  </div></section>

  <section class="bar"><div class="wrap">
    <div class="cols" id="cols"></div>
    <div class="global">
      <button type="button" class="chorus" id="chorus" aria-pressed="true">Coro</button>
      <select id="root" aria-label="Tonalidad"></select>
      <div class="seg" role="group" aria-label="Escala" id="scales">
        <button type="button" data-scale="maj" aria-pressed="false">Mayor</button>
        <button type="button" data-scale="min" aria-pressed="false">Menor</button>
        <button type="button" data-scale="copla" aria-pressed="true" title="Escala frigia dominante, la del flamenco">Copla</button>
      </div>
    </div>
  </div></section>
</div>

/* ---------- music helpers ---------- */
function pcOf(m){ return ((Math.round(m)%12)+12)%12; }
function snap(m){
  var deg=SCALES[tune.scale], best=m, bd=1e9, base=Math.floor((m-tune.root)/12);
  for(var o=base-1;o<=base+1;o++){
    for(var i=0;i<deg.length;i++){
      var n=tune.root+o*12+deg[i], d=Math.abs(n-m);
      if(d<bd){bd=d;best=n;}
    }
  }
  return best;
}
function noteName(m){ var r=Math.round(m); return NOTE[pcOf(r)]+(Math.floor(r/12)-1); }

/* ---------- chorus ---------- */
var chorusKey=null, curLead=null;
function harmony(){
  var lead=null, i;
  PERF.forEach(function(p){ p.sing=false; });
  curLead=null;
  if(!tune.chorus){ chorusKey=null; return; }
  for(i=0;i<PERF.length;i++){ if(PERF[i].down){ lead=PERF[i]; break; } }
  if(!lead){ chorusKey=null; return; }
  curLead=lead;
  var Lq=snap(lead.lo+lead.pP*(lead.hi-lead.lo));
  var key=PERF.indexOf(lead)+':'+Lq+':'+tune.root+':'+tune.scale;
  if(key!==chorusKey){
    chorusKey=key;
    var degs=SCALES[tune.scale];
    var idx=degs.indexOf(((Lq-tune.root)%12+12)%12);
    if(idx<0) idx=0;
    var pcs=[0,2,4].map(function(k){ return (tune.root+degs[(idx+k)%degs.length])%12; });
    var used=[pcOf(Lq)];
    PERF.forEach(function(f){
      if(f===lead||f.down) return;
      var cands=[], m;
      for(m=Math.ceil(f.lo);m<=Math.floor(f.hi);m++){ if(pcs.indexOf(pcOf(m))>=0) cands.push(m); }
      var fresh=cands.filter(function(n){ return used.indexOf(pcOf(n))<0; });
      if(fresh.length) cands=fresh;
      var ref=(f.hm!=null)?f.hm:(f.lo+(f.hi-f.lo)*0.4), best=cands[0], bd=1e9;
      cands.forEach(function(n){ var d=Math.abs(n-ref); if(d<bd){bd=d;best=n;} });
      f.hm=best; used.push(pcOf(best));
    });
  }
  PERF.forEach(function(f){
    if(f===lead||f.down||f.hm==null) return;
    f.sing=true; f.vx=lead.vx;
  });
}

var AC=null, master=null;
function makeIR(sec,decay){
  var len=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(2,len,AC.sampleRate);
  for(var c=0;c<2;c++){
    var d=b.getChannelData(c);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  }
  return b;
}
function initAudio(){
  if(AC) return;
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor) return;
  AC=new Ctor();
  var comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=5; comp.attack.value=.01; comp.release.value=.2;
  master=AC.createGain(); master.gain.value=.9;
  var conv=AC.createConvolver(); conv.buffer=makeIR(2.0,2.4);
  var wet=AC.createGain(); wet.gain.value=.26;
  master.connect(comp); master.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(AC.destination);
  PERF.forEach(buildVoice);
}
function clarWave(){
  var n=24, re=new Float32Array(n), im=new Float32Array(n);
  for(var k=1;k<n;k+=2){ im[k]=1/k; }
  return AC.createPeriodicWave(re,im);
}
function buildVoice(p){
  var A={};

  A.out.gain.setTargetAtTime(p.on?0.42:0, now, p.on?0.04:0.16);
  A.vGain.gain.setTargetAtTime(voice?1.4:0, now, 0.03);
  A.iGain.gain.setTargetAtTime(voice?0:p.ivol, now, 0.03);

  A.vOsc.frequency.setTargetAtTime(f, now, tc);
  A.vOsc2.frequency.setTargetAtTime(f, now, tc);
  A.iOsc.forEach(function(o){ o.frequency.setTargetAtTime(f, now, tc); });

/* ---------- canvas ---------- */
var cv=document.getElementById('stage'), ctx=cv.getContext('2d');
var W=0,H=0,dpr=1,S=1,touched=false;
function resize(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=r.width; H=r.height;

resize();

function metrics(){
  var fl=Math.max(32,46*S), R=44*S, tr=R*1.08;
  var floorY=H-fl, minH=118*S, maxH=Math.max(minH+40,floorY-(tr+44*S));

function rng(seed){
  return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

var SPOTS=[]; (function(){ var r=rng(7); for(var i=0;i<60;i++){ SPOTS.push({u:r()*2-1,v:r(),r:3+r()*3,a:r()*6.28}); } })();

function bodyPath(cx,floorY,topY,bw,tr){

  p.bezierCurveTo(cx-bw,floorY-h*.5, cx-tr,topY+h*.45, cx-tr,topY);
  p.arc(cx,topY,tr,Math.PI,Math.PI*2,false);

  p.closePath();

}
function star(x,y,r1,r2,n,rot,col){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){
    var a=rot+i*Math.PI/n, r=(i%2?r1:r2);
    var px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }

}
function hexA(hex,a){
  var n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
}

var parts=[];
function spawn(x,y,col,R){
  if(parts.length>140) return;
  parts.push({x:x+(Math.random()-.5)*R*1.6, y:y, vx:(Math.random()-.5)*50, vy:-(40+Math.random()*70), life:1, col:col, s:3+Math.random()*4});
}

function drawStageBg(){
  var m=metrics(), cw=W/3;
  ctx.fillStyle='#0b0612'; ctx.fillRect(0,0,W,H);
  PERF.forEach(function(p,i){
    var cx=(i+.5)*cw, a=.07+.2*p.act;
    var g=ctx.createLinearGradient(0,0,0,m.floorY);
    g.addColorStop(0,hexA(p.color,a)); g.addColorStop(1,hexA(p.color,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(cx-10*S,0); ctx.lineTo(cx+10*S,0);
    ctx.lineTo(cx+cw*.46,m.floorY); ctx.lineTo(cx-cw*.46,m.floorY); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle='#1a0f26'; ctx.fillRect(0,m.floorY,W,m.fl);
  ctx.fillStyle='#ff00ff'; ctx.fillRect(0,m.floorY,W,3);
}

function drawTicks(p,cx,m){
  var bw=64*S, lo=Math.ceil(p.lo), hi=Math.floor(p.hi);
  var degs=SCALES[tune.scale];
  for(var n=lo;n<=hi;n++){
    var pc=((n-tune.root)%12+12)%12;
    if(degs.indexOf(pc)<0) continue;
    var pp=(n-p.lo)/(p.hi-p.lo);
    var y=m.floorY-(m.minH+pp*(m.maxH-m.minH));
    var root=pc===0;
    ctx.strokeStyle=root?'rgba(255,0,255,.75)':'rgba(247,240,234,.2)';
    ctx.lineWidth=root?2:1;
    var len=(root?16:9)*S;
    ctx.beginPath();
    ctx.moveTo(cx-bw-14*S,y); ctx.lineTo(cx-bw-14*S-len,y);
    ctx.moveTo(cx+bw+14*S,y); ctx.lineTo(cx+bw+14*S+len,y);
    ctx.stroke();
  }
}

var INST={
  v:{key:'ti',h:250,ax:0.0,ay:0.0104,ar:0.425},
  c:{key:'ba',h:300,ax:0.0,ay:0.0708,ar:0.4083},
  h:{key:'cl',h:285,ax:0.0109,ay:0.0083,ar:0.6979}
};
function drawInstrument(p,cx,fy,m,t){
  var d=INST[p.id], im=IM[d.key]; if(!ready(im)) return;
  var hh=d.h*S, ww=hh*d.ar, ax=cx-m.R*.06, ay=fy+m.R*.52;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,m.floorY); ctx.clip();
  ctx.translate(ax,ay); ctx.rotate(Math.sin(t*5)*.045*p.act);
  ctx.shadowColor='#ff00ff'; ctx.shadowBlur=0; ctx.shadowOffsetX=5*S*dpr; ctx.shadowOffsetY=5*S*dpr;
  ctx.drawImage(im,-d.ax*ww,-d.ay*hh,ww,hh);
  ctx.restore();
}

function drawBlob(p,i,t){
  var m=metrics(), cw=W/3, cx=(i+.5)*cw, R=m.R, tr=m.tr;
  var h=m.minH+Math.max(-.08,Math.min(1.08,p.vp))*(m.maxH-m.minH);
  var breathe=Math.sin(t*2+i*1.7)*2*S*(1-p.act);
  var fy=m.floorY-h+breathe;
  p.fx=cx; p.fy=fy;
  var stretch=clamp01(p.vp);
  var bw=64*S*(1.16-.34*stretch)*(1+.05*p.act*Math.sin(t*16));
  var path=bodyPath(cx,m.floorY,fy,bw,tr);

  drawTicks(p,cx,m);

  ctx.save(); ctx.translate(7*S,7*S); ctx.fillStyle=p.shadow; ctx.fill(path); ctx.restore();

  ctx.save(); ctx.clip(path);
  var top=fy-tr-4, hh=m.floorY-top+4;
  if(p.id==='v'){
    ctx.fillStyle='#2438d4'; ctx.fillRect(cx-bw-4,top,bw*2+8,hh);
    ctx.fillStyle='#10081a'; ctx.fillRect(cx-bw-4,top,bw*.4,hh);
    ctx.fillStyle='#0f7a3a'; ctx.fillRect(cx+bw*.34,top,bw+8,hh);
    ctx.strokeStyle='rgba(247,240,234,.85)'; ctx.lineWidth=2*S;
    ctx.beginPath(); ctx.moveTo(cx-5*S,fy+tr); ctx.lineTo(cx-5*S,m.floorY); ctx.stroke();
  }else if(p.id==='h'){
    ctx.fillStyle='#ff00ff'; ctx.fillRect(cx-bw-4,top,bw*2+8,hh);
    ctx.strokeStyle='#0b0612'; ctx.lineCap='butt'; ctx.lineWidth=14*S;
    var sx=cx-tr*.15, sy=fy+tr*.9, ex=cx+bw*.3, ey=m.floorY+6;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();

    ctx.fillStyle='#d8d8e0'; ctx.fillRect(bx-9*S,by-8*S,18*S,16*S);
    ctx.fillStyle='#0b0612'; ctx.fillRect(bx-5*S,by-4*S,10*S,8*S);
  }else{
    ctx.fillStyle='#a9d2e0'; ctx.fillRect(cx-bw-4,top,bw*2+8,hh);

      var a=rot+k*Math.PI/n, jr=FUR[k%40]*7*S;
      var r=(k%2?R+5*S:R+17*S+jr);
      var px=cx+Math.cos(a)*r, py=fy+Math.sin(a)*r;

    }
    ctx.closePath(); ctx.fillStyle='#e8261c'; ctx.fill();
  }else if(p.id==='c'){
    var sh=function(x,y,flip){ star(x,y,15*S,27*S,11,flip,'#ff00ff'); star(x,y,8*S,18*S,11,flip+.2,'#ff6cff'); };

    ctx.strokeStyle='#0b0612'; ctx.lineWidth=9*S; ctx.lineCap='round';

  ctx.save();
  ctx.translate(cx,fy); ctx.scale(scaleF,scaleF);
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.closePath();
  ctx.fillStyle='#1a0f26'; ctx.fill();
  ctx.clip();
  if(ready(restIm)) ctx.drawImage(restIm,-R,-R,R*2,R*2);

  ctx.lineWidth=4*S; ctx.strokeStyle='#f7f0ea'; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();

var last=0;
function frame(ts){
  var t=ts/1000, dt=Math.min(.05,(t-last)||.016); last=t;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  harmony();
  PERF.forEach(function(p){
    p.on=p.down||p.sing;
    if(p.sing) p.pP=clamp01((p.hm-p.lo)/(p.hi-p.lo));
    var target=p.on?p.pP:0;
    p.vv+=(target-p.vp)*0.28; p.vv*=0.62; p.vp+=p.vv;
    p.act+=((p.on?1:0)-p.act)*(p.on?0.22:0.1);
    if(p.on) p.held+=dt; else p.held=0;
    var raw=p.lo+p.pP*(p.hi-p.lo);
    var q=(p.mode==='inst'||p.auto!=='off')?snap(raw):raw;
    if(q<p.lo-.5) q=snap(p.lo);
    if(q>p.hi+.5) q=snap(p.hi);
    if(p.sing) q=p.hm;
    if(p.on || !p.A) p.midi=q;
    updateAudio(p);
  });
  drawStageBg();
  var m=metrics(), cw=W/3;
  PERF.forEach(function(p,i){ drawBlob(p,i,t); });

  if(curLead){
    ctx.save(); ctx.setLineDash([6*S,7*S]); ctx.lineWidth=2*S; ctx.strokeStyle='rgba(255,0,255,.7)';
    PERF.forEach(function(f){
      if(!f.sing) return;
      ctx.beginPath(); ctx.moveTo(curLead.fx,curLead.fy); ctx.lineTo(f.fx,f.fy); ctx.stroke();
    });
    ctx.restore();
  }
  PERF.forEach(function(p,i){
    if(p.on && Math.random()<.5){
      var h=m.minH+p.vp*(m.maxH-m.minH);
      spawn((i+.5)*cw,m.floorY-h-m.tr,p.color,m.R);
    }
  });
  for(var i=parts.length-1;i>=0;i--){
    var q=parts[i]; q.life-=dt*1.1; q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(q.life<=0){ parts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=q.life; ctx.translate(q.x,q.y); ctx.rotate(.785);
    ctx.fillStyle=q.col; var s=q.s*S*1.2; ctx.fillRect(-s/2,-s/2,s,s); ctx.restore();
  }
  if(!touched){
    var pulse=.6+.4*Math.sin(t*3);
    ctx.save(); ctx.globalAlpha=pulse; ctx.fillStyle='#f7f0ea';
    ctx.font='italic 500 '+Math.max(16,26*S)+'px "Playfair Display",Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tune.chorus?'Tira de un blob y cantan los tres':'Tira de un blob hacia arriba',W/2,Math.max(28,40*S));
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

var byPid={};

}

  touched=true;
  var r=cv.getBoundingClientRect(), cw=W/3;
  var i=Math.max(0,Math.min(2,Math.floor((e.clientX-r.left)/cw)));
  var p=PERF[i];
